<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira S-01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Mira S-01 · mismo lenguaje que el VOID ONE: obsidiana, arena, ambar y el cristal iridiscente del logo */
:root { --arena: #f2efe9; --gris: #a2a7ae; --ambar: #d96a00; --aliado: #9fe6ff; --linea: rgba(255,255,255,.14); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--arena); font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.fondo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.75) contrast(1.06) brightness(.82); }
.espejo { transform: scaleX(-1); }
#hud { position: fixed; inset: 0; width: 100%; height: 100%; }
.vineta { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.72)); }

#inicio { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 38%, #1a1b1f, #000 70%); }
.caja { max-width: 560px; text-align: center; }
.caja svg { width: 92px; height: auto; filter: drop-shadow(0 0 22px rgba(159,240,255,.25)); }
.caja h1 { font-weight: 200; font-size: clamp(52px, 9vw, 96px); line-height: 1; letter-spacing: -.02em; margin: 26px 0 0; }
.caja .sub { color: var(--gris); font-size: 15px; margin: 10px 0 0; }
.caja p { color: var(--gris); line-height: 1.65; font-size: 16px; margin: 26px auto 34px; max-width: 46ch; }
.caja button { font: 500 15px "Montserrat", sans-serif; color: #0a0a0b; background: var(--arena); border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
.caja button:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(242,239,233,.18); }
.caja button:disabled { opacity: .6; cursor: default; transform: none; }
.caja button:focus-visible { outline: 2px solid var(--aliado); outline-offset: 4px; }
#estado { margin-top: 18px; font-size: 14px; min-height: 1.5em; color: var(--gris); }
#estado.error { color: #ff9a3c; }
.caja .seg { margin-top: 30px; font-size: 13px; color: #7d828a; }
.oculto { display: none !important; }
</style>
</head>
<body>
<video id="video" class="fondo oculto espejo" playsinline muted></video>
<canvas id="falso" class="fondo oculto espejo" width="1280" height="720"></canvas>
<canvas id="hud"></canvas>
<div class="vineta" aria-hidden="true"></div>

<div id="inicio">
  <div class="caja">
    <svg viewBox="0 0 1000 946" aria-hidden="true"><defs><linearGradient id="ir" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3e6"/><stop offset=".35" stop-color="#9ff0ff"/><stop offset=".65" stop-color="#fff2a8"/><stop offset="1" stop-color="#b9a6ff"/></linearGradient></defs><polygon points="0,222 84.3,583.2 383.7,946 248.4,515.6" fill="url(#ir)"/><polygon points="91.4,0 234.9,388.4 481.1,624 394.9,332.5" fill="url(#ir)"/><polygon points="1000,222 915.7,583.2 616.3,946 751.6,515.6" fill="url(#ir)"/><polygon points="908.6,0 765.1,388.4 518.9,624 605.1,332.5" fill="url(#ir)"/></svg>
    <h1>Mira S-01</h1>
    <div class="sub">Montalvo Dynamics · futuro desarrollo</div>
    <p>Detecta a cada persona frente a la cámara y reconoce a tu equipo por su uniforme: polera negra y jean negro. Si apuntas a un aliado, el disparo queda bloqueado.</p>
    <button id="arrancar" type="button">Iniciar cámara</button>
    <div id="estado" role="status"></div>
    <div class="seg">Demo de software. Solo muestra información y nunca dispara.</div>
  </div>
</div>

<script type="module">
/* ============================================================
   MIRA S-01 · demo de vision por computadora (Montalvo Dynamics)
   - Detecta hasta 5 personas con MediaPipe Pose Landmarker.
   - Aliado = torso Y piernas predominantemente negros (polera + jean negro).
   - Solo dibuja informacion. No controla ningun dispositivo.
   Teclas: R registrar uniforme · [ ] sensibilidad · M espejo · C camara
           F pantalla completa · D diagnostico · H ocultar ayuda
   ============================================================ */
const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODELO_LOCAL = './modelos/pose_landmarker_lite.task';
const MODELO_WEB = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const HFOV = 65;                      // campo de vision horizontal tipico de webcam de laptop (grados)
const HOMBROS_M = 0.38;               // ancho de hombros promedio (m) para estimar distancia
const ARENA = '#f2efe9', GRIS = '#a2a7ae', ALI = '#9fe6ff', OPO = '#ff8a1e', VIDRIO = 'rgba(12,12,14,.58)', BORDE = 'rgba(255,255,255,.14)';
const FUENTE = '"Montserrat", "Helvetica Neue", Arial, sans-serif';
const LOGO = [[0,222,84.3,583.2,383.7,946,248.4,515.6],[91.4,0,234.9,388.4,481.1,624,394.9,332.5],[1000,222,915.7,583.2,616.3,946,751.6,515.6],[908.6,0,765.1,388.4,518.9,624,605.1,332.5]];
const HUESOS = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const prueba = new URLSearchParams(location.search).has('prueba');

const $ = id => document.getElementById(id);
const video = $('video'), falso = $('falso'), hud = $('hud'), ctx = hud.getContext('2d');
const S = { tracks: [], sigId: 1, thrY: 72, thrC: 50, espejo: true, ayuda: false, diag: false, calib: null, fps: 0, msg: null, camaras: [], camIdx: 0, stream: null, abre: 0, anillo: 0 };

/* ---------- fuente de imagen (camara real o escena de prueba) ---------- */
let fuente = null, detector = null;
const muestra = document.createElement('canvas'), mctx = muestra.getContext('2d', { willReadFrequently: true });
let pix = null, SW = 192, SH = 108;

async function iniciarCamara(idx) {
  if (S.stream) S.stream.getTracks().forEach(t => t.stop());
  const cam = S.camaras[idx];
  const v = { width: { ideal: 1280 }, height: { ideal: 720 } };
  if (cam) v.deviceId = { exact: cam.deviceId };
  S.stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
  video.srcObject = S.stream; await video.play();
  fuente = { el: video, w: () => video.videoWidth, h: () => video.videoHeight };
}

async function cargarDetector() {
  let lib, base;
  try { lib = await import('./lib/vision_bundle.mjs'); base = new URL('./lib/wasm', location.href).href; }
  catch { lib = await import(CDN + '/vision_bundle.mjs'); base = CDN + '/wasm'; }
  let modelo = MODELO_WEB;
  try { const r = await fetch(MODELO_LOCAL, { method: 'HEAD' }); if (r.ok) modelo = MODELO_LOCAL; } catch {}
  const fs = await lib.FilesetResolver.forVisionTasks(base);
  const op = d => ({ baseOptions: { modelAssetPath: modelo, delegate: d }, runningMode: 'VIDEO', numPoses: 5, minPoseDetectionConfidence: .5, minPosePresenceConfidence: .5, minTrackingConfidence: .5 });
  try { return await lib.PoseLandmarker.createFromOptions(fs, op('GPU')); }
  catch { return await lib.PoseLandmarker.createFromOptions(fs, op('CPU')); }
}

/* escena sintetica para probar sin camara: 3 personas, una con polera+jean negros */
const FALSAS = [
  { x: .30, h: .78, cam: '#121212', pan: '#16181c', v: .05, f: .9 },
  { x: .56, h: .58, cam: '#b8452e', pan: '#2f4c7a', v: .07, f: 1.3 },
  { x: .78, h: .86, cam: '#d9d4c7', pan: '#141414', v: .04, f: .7 },
];
function poseFalsa(p, t) {
  const cx = p.x + Math.sin(t / 1000 * p.f) * p.v, top = .97 - p.h, h = p.h, L = (x, y) => ({ x, y, z: 0, visibility: .99 });
  const a = Array.from({ length: 33 }, () => L(cx, top + .3 * h));
  a[0] = L(cx, top + .07 * h);
  a[11] = L(cx + .1 * h, top + .2 * h); a[12] = L(cx - .1 * h, top + .2 * h);
  a[13] = L(cx + .13 * h, top + .36 * h); a[14] = L(cx - .13 * h, top + .36 * h);
  a[15] = L(cx + .14 * h, top + .5 * h); a[16] = L(cx - .14 * h, top + .5 * h);
  a[23] = L(cx + .065 * h, top + .52 * h); a[24] = L(cx - .065 * h, top + .52 * h);
  a[25] = L(cx + .07 * h, top + .75 * h); a[26] = L(cx - .07 * h, top + .75 * h);
  a[27] = L(cx + .07 * h, top + .97 * h); a[28] = L(cx - .07 * h, top + .97 * h);
  return a;
}
function pintarFalso(t) {
  const c = falso.getContext('2d'), w = falso.width, hh = falso.height;
  const g = c.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, '#6d7378'); g.addColorStop(.62, '#8a8f8f'); g.addColorStop(.63, '#5b5e5a'); g.addColorStop(1, '#3f413d');
  c.fillStyle = g; c.fillRect(0, 0, w, hh);
  FALSAS.forEach(p => { const L = poseFalsa(p, t), X = q => q.x * w, Y = q => q.y * hh, h = p.h * hh;
    c.fillStyle = p.pan; c.fillRect(X(L[24]) - h * .05, Y(L[24]), X(L[23]) - X(L[24]) + h * .1, Y(L[27]) - Y(L[24]));
    c.fillStyle = p.cam; c.fillRect(X(L[12]) - h * .02, Y(L[12]) - h * .02, X(L[11]) - X(L[12]) + h * .04, Y(L[24]) - Y(L[12]) + h * .04);
    c.strokeStyle = p.cam; c.lineWidth = h * .05; c.lineCap = 'round';
    [[11, 13, 15], [12, 14, 16]].forEach(([a, b, d]) => { c.beginPath(); c.moveTo(X(L[a]), Y(L[a])); c.lineTo(X(L[b]), Y(L[b])); c.lineTo(X(L[d]), Y(L[d])); c.stroke(); });
    c.fillStyle = '#c69c7d'; c.beginPath(); c.arc(X(L[0]), Y(L[0]), h * .065, 0, 7); c.fill(); });
}

/* ---------- analisis de ropa ---------- */
function leerPixeles() {
  const w = fuente.w(), h = fuente.h(); if (!w || !h) return false;
  SW = 192; SH = Math.round(192 * h / w); if (muestra.width !== SW) { muestra.width = SW; muestra.height = SH; }
  mctx.drawImage(fuente.el, 0, 0, SW, SH); pix = mctx.getImageData(0, 0, SW, SH).data; return true;
}
function px(x, y) {                     // x,y normalizados -> [Y, croma]
  const i = ((Math.min(SH - 1, Math.max(0, y * SH | 0))) * SW + Math.min(SW - 1, Math.max(0, x * SW | 0))) * 4;
  const r = pix[i], g = pix[i + 1], b = pix[i + 2];
  return [.299 * r + .587 * g + .114 * b, Math.max(r, g, b) - Math.min(r, g, b)];
}
function cuad(q, n = 7) {               // q = [hombroD, hombroI, caderaI, caderaD]; muestreo encogido al centro
  const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4, cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;
  const k = .7, P = q.map(p => ({ x: cx + (p.x - cx) * k, y: cy + (p.y - cy) * k })), out = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const u = (i + .5) / n, v = (j + .5) / n;
    const ax = P[0].x + (P[1].x - P[0].x) * u, ay = P[0].y + (P[1].y - P[0].y) * u, bx = P[3].x + (P[2].x - P[3].x) * u, by = P[3].y + (P[2].y - P[3].y) * u;
    out.push(px(ax + (bx - ax) * v, ay + (by - ay) * v)); }
  return out;
}
function seg(a, b, n = 8) { const out = []; for (let i = 0; i < n; i++) { const u = .15 + .7 * (i + .5) / n; out.push(px(a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u)); } return out; }
const fracNegro = m => m.length ? m.filter(([y, c]) => y < S.thrY && c < S.thrC).length / m.length : 0;
const vis = (...p) => p.every(q => (q.visibility ?? 1) > .5 && q.x > 0 && q.x < 1 && q.y > 0 && q.y < 1);

function analizar(L) {
  const ok = L.filter(p => (p.visibility ?? 1) > .4 && p.x > -.05 && p.x < 1.05 && p.y > -.05 && p.y < 1.05);
  if (ok.length < 6 || !vis(L[11], L[12])) return null;
  let x0 = Math.min(...ok.map(p => p.x)), x1 = Math.max(...ok.map(p => p.x)), y0 = Math.min(...ok.map(p => p.y)), y1 = Math.max(...ok.map(p => p.y));
  const hom = Math.hypot(L[11].x - L[12].x, L[11].y - L[12].y);
  y0 -= hom * .45; x0 -= hom * .25; x1 += hom * .25; y1 += hom * .08;
  const d = { box: [Math.max(0, x0), Math.max(0, y0), Math.min(1, x1), Math.min(1, y1)], hom, L, torso: null, piernas: null, mT: [], mP: [] };
  if (vis(L[23], L[24])) { d.mT = cuad([L[12], L[11], L[23], L[24]]); d.torso = fracNegro(d.mT); }
  else { const est = [L[12], L[11], { x: L[11].x, y: L[11].y + hom * 1.2 }, { x: L[12].x, y: L[12].y + hom * 1.2 }]; d.mT = cuad(est); d.torso = fracNegro(d.mT); }
  if (vis(L[23], L[25]) || vis(L[24], L[26])) {
    if (vis(L[23], L[25])) d.mP.push(...seg(L[23], L[25])); if (vis(L[24], L[26])) d.mP.push(...seg(L[24], L[26]));
    if (vis(L[25], L[27])) d.mP.push(...seg(L[25], L[27])); if (vis(L[26], L[28])) d.mP.push(...seg(L[26], L[28]));
    d.piernas = fracNegro(d.mP);
  }
  return d;
}

/* ---------- seguimiento con ID y decision con histeresis ---------- */
function asociar(dets, t) {
  const cen = b => [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
  const pares = [];
  S.tracks.forEach((tr, i) => dets.forEach((d, j) => { const a = cen(tr.box), b = cen(d.box); pares.push([Math.hypot(a[0] - b[0], a[1] - b[1]), i, j]); }));
  pares.sort((p, q) => p[0] - q[0]);
  const usT = new Set(), usD = new Set();
  for (const [dist, i, j] of pares) { if (usT.has(i) || usD.has(j)) continue; const tr = S.tracks[i], d = dets[j];
    if (dist > Math.max(.12, (tr.box[2] - tr.box[0]) * .8)) continue; usT.add(i); usD.add(j); actualizar(tr, d, t); }
  dets.forEach((d, j) => { if (!usD.has(j)) { const tr = { id: S.sigId++, nace: t, score: .5, estado: 'ANALIZANDO', box: d.box.slice() }; actualizar(tr, d, t); S.tracks.push(tr); } });
  S.tracks = S.tracks.filter(tr => t - tr.visto < 700);
}
function actualizar(tr, d, t) {
  tr.box = tr.box.map((v, k) => v + (d.box[k] - v) * .55); tr.d = d; tr.visto = t;
  tr.Ls = tr.Ls ? tr.Ls.map((p, k) => ({ x: p.x + (d.L[k].x - p.x) * .6, y: p.y + (d.L[k].y - p.y) * .6, visibility: d.L[k].visibility })) : d.L.map(p => ({ ...p }));
  const conPiernas = d.piernas !== null;
  const aliado = conPiernas ? (d.torso > .55 && d.piernas > .5) : d.torso > .62;
  tr.score += ((aliado ? 1 : 0) - tr.score) * (conPiernas ? .14 : .07);
  if (t - tr.nace < 650) tr.estado = 'ANALIZANDO';
  else if (tr.score > .62) tr.estado = 'ALIADO';
  else if (tr.score < .38) tr.estado = 'OPONENTE';
  else if (tr.estado === 'ANALIZANDO') tr.estado = 'DESCONOCIDO';
  tr.conf = tr.estado === 'ALIADO' ? tr.score : 1 - tr.score;
  const fpx = fuente.w() / (2 * Math.tan(HFOV * Math.PI / 360));
  const hpx = d.hom * fuente.w(); tr.dist = hpx > 4 ? HOMBROS_M * fpx / hpx : null;
  tr.parcial = !conPiernas;
}

/* ---------- calibracion: registrar el uniforme del equipo ---------- */
function pct(a, p) { const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; }
function calibrar(t) {
  const c = S.calib; if (!c) return;
  if (c.fase === 'cuenta' && t - c.t0 > 3000) { c.fase = 'muestra'; c.t1 = t; c.Y = []; c.C = []; }
  if (c.fase === 'muestra') {
    const tr = objetivo(); if (tr && tr.d) { [...tr.d.mT, ...tr.d.mP].forEach(([y, ch]) => { c.Y.push(y); c.C.push(ch); }); c.id = tr.id; }
    if (t - c.t1 > 1200) {
      if (c.Y.length < 40) { aviso('No hay nadie en el centro de la mira. Presiona R para repetir.', OPO, t); S.calib = null; return; }
      S.thrY = Math.round(Math.min(140, Math.max(40, pct(c.Y, .7) * 1.25 + 12)));
      S.thrC = Math.round(Math.min(90, Math.max(30, pct(c.C, .7) * 1.3 + 10)));
      const tr2 = S.tracks.find(x => x.id === c.id); if (tr2) { tr2.score = 1; tr2.estado = 'ALIADO'; }
      aviso('Uniforme aliado registrado', ALI, t); S.calib = null;
    }
  }
}
function aviso(txt, col, t) { S.msg = { txt, col, t }; }

/* objetivo = persona bajo la reticula (centro de la pantalla) */
function objetivo() {
  if (!fuente) return null;
  const m = mapa(), cx = m.W / 2, cy = m.H / 2; let mejor = null, md = 1e9;
  for (const tr of S.tracks) { const [a, b] = caja(tr.box, m); if (cx >= a.x && cx <= b.x && cy >= a.y && cy <= b.y) { const d = Math.hypot((a.x + b.x) / 2 - cx, (a.y + b.y) / 2 - cy); if (d < md) { md = d; mejor = tr; } } }
  return mejor;
}

/* ---------- geometria pantalla ---------- */
function mapa() { const W = innerWidth, H = innerHeight, vw = fuente.w() || 1280, vh = fuente.h() || 720, s = Math.max(W / vw, H / vh); return { W, H, s, vw, vh, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 }; }
function pt(x, y, m) { let X = x * m.vw * m.s + m.ox; if (S.espejo) X = m.W - X; return { x: X, y: y * m.vh * m.s + m.oy }; }
function caja(b, m) { const p = pt(b[0], b[1], m), q = pt(b[2], b[3], m); return [{ x: Math.min(p.x, q.x), y: p.y }, { x: Math.max(p.x, q.x), y: q.y }]; }

/* ---------- primitivas de dibujo ---------- */
const nf = (v, d = 1) => v.toFixed(d).replace('.', ',');
const id2 = n => String(n).padStart(2, '0');
function tx(s, x, y, col = ARENA, sz = 14, al = 'left', peso = 400) { ctx.shadowColor = 'rgba(0,0,0,.75)'; ctx.shadowBlur = 8; ctx.font = `${peso} ${sz}px ${FUENTE}`; ctx.textAlign = al; ctx.fillStyle = col; ctx.fillText(s, x, y); return ctx.measureText(s).width; }
function ancho(s, sz, peso = 400) { ctx.font = `${peso} ${sz}px ${FUENTE}`; return ctx.measureText(s).width; }
function linea(pts, col, w = 1.2, alfa = 1, dash = []) { ctx.save(); ctx.globalAlpha = alfa; ctx.beginPath(); ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.lineWidth = w; pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.restore(); }
function vidrio(x, y, w, h, r) { ctx.save(); ctx.shadowBlur = 0; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = VIDRIO; ctx.fill(); ctx.strokeStyle = BORDE; ctx.lineWidth = 1; ctx.stroke(); ctx.restore(); }
function iri(x0, y0, x1, y1) { const g = ctx.createLinearGradient(x0, y0, x1, y1); [[0, '#ffb3e6'], [.35, '#9ff0ff'], [.65, '#fff2a8'], [1, '#b9a6ff']].forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function cristal(cx, cy, s, abre, estilo) {    // el logo de 4 cristales; abre = separacion hacia afuera
  const k = s / 1000;
  LOGO.forEach((p, i) => { const dx = (i < 2 ? -1 : 1) * abre, dy = (i % 2 ? -1 : 1) * abre * .5;
    ctx.beginPath(); for (let j = 0; j < 8; j += 2) { const X = cx + (p[j] - 500) * k + dx, Y = cy + (p[j + 1] - 473) * k + dy; j ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); } ctx.closePath();
    if (estilo.relleno) { ctx.fillStyle = estilo.relleno; ctx.fill(); } if (estilo.trazo) { ctx.strokeStyle = estilo.trazo; ctx.lineWidth = estilo.w || 1.5; ctx.stroke(); } });
}
function candado(x, y, col) { ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x - 11, y - 6, 22, 17, 3); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y - 6, 6.5, Math.PI, 0); ctx.stroke(); ctx.restore(); }
function tecla(x, y, k, txt) { ctx.save(); ctx.shadowBlur = 0; ctx.beginPath(); ctx.roundRect(x, y - 15, 22, 22, 5); ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.stroke(); ctx.restore(); tx(k, x + 11, y + 1, ARENA, 11, 'center', 600); return 22 + 8 + tx(txt, x + 30, y + 1, GRIS, 12) + 22; }

/* ---------- HUD ---------- */
function persona(tr, m, W, enMira) {
  const col = tr.estado === 'ALIADO' ? ALI : tr.estado === 'ANALIZANDO' ? ARENA : OPO;
  const alfa = tr.estado === 'ANALIZANDO' ? .45 : .8, L = tr.Ls;
  // esqueleto
  HUESOS.forEach(([a, b]) => { if (vis(L[a], L[b])) { const p = pt(L[a].x, L[a].y, m), q = pt(L[b].x, L[b].y, m); linea([[p.x, p.y], [q.x, q.y]], col, 1.2, alfa); } });
  ctx.fillStyle = col; ctx.globalAlpha = alfa + .15;
  [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28].forEach(k => { if (vis(L[k])) { const p = pt(L[k].x, L[k].y, m); ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, 7); ctx.fill(); } });
  ctx.globalAlpha = 1;
  // esquinas finas del recuadro
  const [a, b] = caja(tr.box, m), E = Math.min(16, (b.x - a.x) * .2);
  [[a.x, a.y, 1, 1], [b.x, a.y, -1, 1], [b.x, b.y, -1, -1], [a.x, b.y, 1, -1]].forEach(([x, y, dx, dy]) => linea([[x, y + dy * E], [x, y], [x + dx * E, y]], col, 1.4, tr.estado === 'ANALIZANDO' ? .3 : .55));
  // linea guia desde el hombro exterior hacia afuera de la pantalla
  const hI = pt(L[11].x, L[11].y, m), hD = pt(L[12].x, L[12].y, m), cxp = (a.x + b.x) / 2, dir = cxp < W / 2 ? -1 : 1;
  const h0 = dir < 0 ? (hI.x < hD.x ? hI : hD) : (hI.x > hD.x ? hI : hD);
  const nom = tr.estado === 'ALIADO' ? `Aliado ${id2(tr.id)}` : tr.estado === 'OPONENTE' ? `Oponente ${id2(tr.id)}` : tr.estado === 'DESCONOCIDO' ? `Sin identificar ${id2(tr.id)}` : 'Analizando';
  const sub = tr.estado === 'ANALIZANDO' ? '' : (tr.dist ? `${nf(tr.dist)} m` : '') + `     ${Math.round(tr.conf * 100)} %` + (tr.parcial ? '     parcial' : '');
  const lw = Math.max(ancho(nom, 15, 500), ancho(sub, 12)) + 12;
  let ex = h0.x + dir * 48, ey = Math.max(96, h0.y - 48);
  ex = Math.min(W - lw - 24, Math.max(lw + 24, ex));
  const fx = ex + dir * lw;
  if (enMira) return;
  linea([[h0.x, h0.y], [ex, ey], [fx, ey]], col, 1, alfa);
  const al = dir > 0 ? 'left' : 'right', tx0 = ex + dir * 6;
  tx(nom, tx0, ey - 9, col, 15, al, 500);
  if (sub) tx(sub, tx0, ey + 19, ARENA, 12, al);
  if (S.diag && tr.d) { const d = tr.d, q = [d.L[12], d.L[11], d.L[23], d.L[24]].map(p => pt(p.x, p.y, m));
    linea([...q.map(p => [p.x, p.y]), [q[0].x, q[0].y]], '#ffffff', 1, .6, [3, 3]);
    tx(`Torso ${d.torso * 100 | 0} %   Piernas ${d.piernas === null ? '–' : (d.piernas * 100 | 0) + ' %'}`, tx0, ey + 37, GRIS, 11, al); }
}

function dibujar(t) {
  const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  if (hud.width !== W * dpr || hud.height !== H * dpr) { hud.width = W * dpr; hud.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const m = mapa(), cx = W / 2, cy = H / 2, u = Math.max(.75, Math.min(1.25, Math.min(W, H) / 900));
  const obj = objetivo(), bloq = obj && obj.estado === 'ALIADO', marca = obj && (obj.estado === 'OPONENTE' || obj.estado === 'DESCONOCIDO');
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 6;

  for (const tr of S.tracks) persona(tr, m, W, tr === obj);

  // marcador de horizonte
  [-1, 1].forEach(s => linea([[cx + s * 120 * u, cy], [cx + s * 250 * u, cy], [cx + s * 250 * u, cy + 8]], ARENA, 1, .5));

  // reticula: el cristal del logo; se abre y muestra un candado cuando hay un aliado en la mira
  S.abre += ((bloq ? 14 : 0) - S.abre) * .18; S.anillo += ((obj ? 1 : 0) - S.anillo) * .15;
  const R = 70 * u, colR = bloq ? ALI : marca ? OPO : ARENA;
  ctx.save(); ctx.shadowColor = bloq ? 'rgba(159,230,255,.6)' : 'rgba(159,240,255,.35)'; ctx.shadowBlur = 14;
  cristal(cx, cy, 92 * u, S.abre * u, { trazo: iri(cx - 50, cy - 50, cx + 50, cy + 50), w: 1.6 });
  ctx.restore();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(obj ? 0 : t / 1000 * .25);
  ctx.beginPath(); ctx.strokeStyle = colR; ctx.lineWidth = obj ? 1.6 : 1; ctx.setLineDash(obj ? [] : [2, 7]); ctx.globalAlpha = obj ? .95 : .7; ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  if (obj) [0, 1, 2, 3].forEach(k => { const a = k * Math.PI / 2; linea([[cx + Math.cos(a) * (R + 8), cy + Math.sin(a) * (R + 8)], [cx + Math.cos(a) * (R + 20), cy + Math.sin(a) * (R + 20)]], colR, 1.6, S.anillo); });
  if (bloq) candado(cx, cy + 2, ALI);

  // lecturas junto a la reticula
  const dist = obj && obj.dist ? nf(obj.dist) : '–', conf = obj ? String(Math.round(obj.conf * 100)) : '–';
  tx(dist, cx - 290 * u, cy - 6, ARENA, 34 * u, 'right', 300); tx('metros', cx - 290 * u, cy + 18, GRIS, 12, 'right');
  tx(conf, cx + 290 * u, cy - 6, ARENA, 34 * u, 'left', 300); tx('% de confianza', cx + 290 * u, cy + 18, GRIS, 12, 'left');

  // estado central
  const yE = cy + R + 58 * u;
  if (bloq) { tx('Fuego bloqueado', cx, yE, ALI, 26 * u, 'center', 300); tx(`Aliado ${id2(obj.id)} en la mira`, cx, yE + 24, GRIS, 13, 'center'); }
  else if (marca) { tx(`${obj.estado === 'OPONENTE' ? 'Oponente' : 'Sin identificar'} ${id2(obj.id)} en la mira`, cx, yE, OPO, 22 * u, 'center', 300); tx('La decisión es del tirador', cx, yE + 24, GRIS, 13, 'center'); }

  // esquina superior izquierda: marca
  ctx.shadowBlur = 0; cristal(44, 44, 34, 0, { relleno: iri(27, 27, 61, 61) });
  tx('Mira S-01', 72, 42, ARENA, 15, 'left', 500); tx('Modo entrenamiento', 72, 60, GRIS, 12);
  // esquina superior derecha: hora
  const d = new Date(); tx([d.getHours(), d.getMinutes()].map(n => String(n).padStart(2, '0')).join(':'), W - 32, 50, ARENA, 22, 'right', 300);
  if (S.diag) tx(`${S.fps | 0} fps   sensibilidad ${S.thrY}`, W - 32, 72, GRIS, 12, 'right');

  // contador inferior segmentado
  const nA = S.tracks.filter(x => x.estado === 'ALIADO').length, nO = S.tracks.filter(x => x.estado === 'OPONENTE' || x.estado === 'DESCONOCIDO').length, nP = S.tracks.length;
  const segs = [[nP, nP === 1 ? 'persona' : 'personas', ARENA], [nA, nA === 1 ? 'aliado' : 'aliados', ALI], [nO, nO === 1 ? 'oponente' : 'oponentes', OPO]];
  const anchos = segs.map(([n, l]) => ancho(String(n), 24, 300) + 8 + ancho(l, 13) + 40);
  const bw = anchos.reduce((a, b) => a + b, 0) + 16, bx = cx - bw / 2, by = H - 84;
  vidrio(bx, by, bw, 52, 26);
  let x = bx + 28;
  segs.forEach(([n, l, c], i) => { if (i) linea([[x - 20, by + 15], [x - 20, by + 37]], '#ffffff', 1, .14);
    const w1 = tx(String(n), x, by + 35, c, 24, 'left', 300); tx(l, x + w1 + 8, by + 34, GRIS, 13); x += anchos[i]; });

  // seguridad y ayuda
  tx('Solo muestra información.', W - 32, H - 50, GRIS, 12, 'right'); tx('Nunca dispara.', W - 32, H - 32, GRIS, 12, 'right');
  if (S.ayuda) { const teclas = [['R', 'Registrar uniforme'], ['F', 'Pantalla completa'], ['M', 'Espejo'], ['C', 'Cambiar cámara'], ['D', 'Diagnóstico'], ['[ ]', 'Sensibilidad'], ['H', 'Ocultar esta ayuda']];
    vidrio(24, H - 40 - teclas.length * 30, 228, teclas.length * 30 + 18, 16); teclas.forEach(([k, l], i) => tecla(40, H - 40 - teclas.length * 30 + 30 + i * 30, k, l)); }
  else tecla(32, H - 38, 'H', 'Ayuda');

  // calibracion y avisos
  if (S.calib) { const c = S.calib, n = c.fase === 'cuenta' ? Math.ceil((3000 - (t - c.t0)) / 1000) : null;
    vidrio(cx - 220, 92, 440, 112, 22);
    tx('Registrar uniforme aliado', cx, 128, ALI, 17, 'center', 500);
    tx(n ? 'Párate en el centro de la mira' : 'Leyendo los colores del uniforme…', cx, 154, ARENA, 14, 'center');
    if (n) tx(String(n), cx, 190, ARENA, 30, 'center', 200); }
  else if (S.msg && t - S.msg.t < 3000) { const w = ancho(S.msg.txt, 14, 500) + 48; vidrio(cx - w / 2, 96, w, 44, 22); tx(S.msg.txt, cx, 123, S.msg.col, 14, 'center', 500); }
}

/* ---------- bucle ---------- */
let ultimo = -1, tPrev = performance.now();
function cuadro() {
  const t = performance.now();
  if (prueba) pintarFalso(t);
  let poses = null;
  if (prueba) poses = FALSAS.map(p => poseFalsa(p, t));
  else if (detector && video.readyState >= 2 && video.currentTime !== ultimo) { ultimo = video.currentTime; const r = detector.detectForVideo(video, t); poses = r.landmarks || []; }
  if (poses && leerPixeles()) { asociar(poses.map(analizar).filter(Boolean), t); }
  calibrar(t); dibujar(t);
  const dt = t - tPrev; tPrev = t; S.fps += ((1000 / Math.max(1, dt)) - S.fps) * .05;
  requestAnimationFrame(cuadro);
}

/* ---------- controles ---------- */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), t = performance.now();
  if (k === 'r') { S.calib = { fase: 'cuenta', t0: t }; }
  else if (k === '[') { S.thrY = Math.max(30, S.thrY - 4); aviso('Sensibilidad al negro ' + S.thrY, ARENA, t); }
  else if (k === ']') { S.thrY = Math.min(160, S.thrY + 4); aviso('Sensibilidad al negro ' + S.thrY, ARENA, t); }
  else if (k === 'm') { S.espejo = !S.espejo; video.classList.toggle('espejo', S.espejo); falso.classList.toggle('espejo', S.espejo); }
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'd') S.diag = !S.diag;
  else if (k === 'h') S.ayuda = !S.ayuda;
  else if (k === 'c' && S.camaras.length > 1) { S.camIdx = (S.camIdx + 1) % S.camaras.length; iniciarCamara(S.camIdx).then(() => aviso(`Cámara ${S.camIdx + 1} de ${S.camaras.length}`, ARENA, performance.now())); }
});

$('arrancar').addEventListener('click', async () => {
  const est = $('estado'), b = $('arrancar'); b.disabled = true; est.classList.remove('error');
  try {
    if (prueba) { fuente = { el: falso, w: () => falso.width, h: () => falso.height }; falso.classList.remove('oculto'); }
    else {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('Este navegador no permite usar la cámara aquí. Abre la página en Chrome desde su enlace https.');
      est.textContent = 'Esperando el permiso de la cámara…';
      await iniciarCamara();
      S.camaras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      video.classList.remove('oculto');
      est.textContent = 'Cargando la red neuronal…';
      detector = await cargarDetector();
    }
    await document.fonts.ready;
    $('inicio').classList.add('oculto');
    requestAnimationFrame(cuadro);
  } catch (e) {
    console.error(e); b.disabled = false; est.classList.add('error');
    est.textContent = e.name === 'NotAllowedError' ? 'El permiso de cámara está bloqueado. Actívalo en el candado de la barra de direcciones y vuelve a intentar.' :
      e.name === 'NotFoundError' ? 'No se encontró ninguna cámara. Conecta una y vuelve a intentar.' : 'No se pudo iniciar: ' + (e.message || e);
  }
});
if (prueba) { const q = new URLSearchParams(location.search); if (q.has('aliado')) { FALSAS[0].x = .5; FALSAS[1].x = .27; } if (q.has('diag')) { S.diag = true; S.ayuda = true; } if (q.has('auto')) $('arrancar').click(); }
window.__S = S;
</script>
