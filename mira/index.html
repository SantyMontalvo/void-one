<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira S-01 · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@200;300;500&display=swap" rel="stylesheet">
<style>
:root { --g: #7dffb0; --a: #ffb020; --c: #58d6ff; --negro: #000; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--g); font-family: "IBM Plex Mono", ui-monospace, monospace; }
.fondo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(.35) contrast(1.12) brightness(.8); }
.espejo { transform: scaleX(-1); }
#hud { position: fixed; inset: 0; width: 100%; height: 100%; }
.scan { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.7)); }
#inicio { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 40%, #0d1912, #000 72%); }
.caja { max-width: 620px; text-align: center; }
.caja small { font-size: 12px; letter-spacing: .3em; opacity: .8; }
.caja h1 { font-family: Montserrat, sans-serif; font-weight: 200; font-size: clamp(48px, 9vw, 96px); letter-spacing: .04em; margin: 14px 0 6px; color: #e9fff2; text-shadow: 0 0 24px rgba(125,255,176,.35); }
.caja p { color: #9fbfae; line-height: 1.6; font-size: 14px; margin: 0 auto 28px; max-width: 48ch; }
.caja button { font: 600 13px "IBM Plex Mono", monospace; letter-spacing: .2em; color: #001a0b; background: var(--g); border: 0; padding: 16px 28px; cursor: pointer; box-shadow: 0 0 30px rgba(125,255,176,.35); }
.caja button:hover { filter: brightness(1.1); }
.caja button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
.caja .seg { margin-top: 26px; font-size: 11px; letter-spacing: .14em; color: var(--a); }
#estado { margin-top: 16px; font-size: 12px; letter-spacing: .1em; min-height: 1.4em; color: #9fbfae; }
.oculto { display: none !important; }
</style>
</head>
<body>
<video id="video" class="fondo oculto" playsinline muted></video>
<canvas id="falso" class="fondo oculto" width="1280" height="720"></canvas>
<canvas id="hud"></canvas>
<div class="scan" aria-hidden="true"></div>

<div id="inicio">
  <div class="caja">
    <small>MONTALVO DYNAMICS · FUTURO DESARROLLO</small>
    <h1>MIRA S-01</h1>
    <p>Demo de software: detecta y sigue a las personas frente a la cámara y reconoce a tu equipo por su uniforme (polera negra + jean negro). Si apuntas a un aliado, el disparo queda bloqueado.</p>
    <button id="arrancar" type="button">INICIAR CÁMARA</button>
    <div id="estado" role="status"></div>
    <div class="seg">SOLO VISUALIZA · NO CONTROLA NINGÚN EQUIPO · NUNCA DISPARA</div>
  </div>
</div>

<script type="module">
/* ============================================================
   MIRA S-01 · demo de visión por computadora (Montalvo Dynamics)
   - Detecta hasta 5 personas con MediaPipe Pose Landmarker.
   - Aliado = torso Y piernas predominantemente negros (polera + jean negro).
   - Solo dibuja información. No controla ningún dispositivo.
   Teclas: R registrar aliado · [ ] umbral · M espejo · C cambiar cámara
           F pantalla completa · D diagnóstico · H ocultar ayuda
   ============================================================ */
const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODELO_LOCAL = './modelos/pose_landmarker_lite.task';
const MODELO_WEB = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const HFOV = 65;                      // campo de vision horizontal tipico de webcam de laptop (grados)
const HOMBROS_M = 0.38;               // ancho de hombros promedio (m) para estimar distancia
const G = '#7dffb0', A = '#ffb020', C = '#58d6ff', W_ = '#e9fff2';
const prueba = new URLSearchParams(location.search).has('prueba');

const $ = id => document.getElementById(id);
const video = $('video'), falso = $('falso'), hud = $('hud'), ctx = hud.getContext('2d');
const S = { tracks: [], sigId: 1, thrY: 72, thrC: 50, espejo: false, ayuda: true, diag: false, calib: null, fps: 0, msg: null, camaras: [], camIdx: 0, stream: null };

/* ---------- fuente de imagen (camara real o escena de prueba) ---------- */
let fuente = null, detector = null;
const muestra = document.createElement('canvas'), mctx = muestra.getContext('2d', { willReadFrequently: true });
let pix = null, SW = 192, SH = 108;

async function iniciarCamara(idx) {
  if (S.stream) S.stream.getTracks().forEach(t => t.stop());
  const cam = S.camaras[idx];
  const v = { width: { ideal: 1280 }, height: { ideal: 720 } };
  if (cam) v.deviceId = { exact: cam.deviceId };
  S.stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
  video.srcObject = S.stream; await video.play();
  fuente = { el: video, w: () => video.videoWidth, h: () => video.videoHeight };
}

async function cargarDetector() {
  let lib, base;
  try { lib = await import('./lib/vision_bundle.mjs'); base = new URL('./lib/wasm', location.href).href; }
  catch { lib = await import(CDN + '/vision_bundle.mjs'); base = CDN + '/wasm'; }
  let modelo = MODELO_WEB;
  try { const r = await fetch(MODELO_LOCAL, { method: 'HEAD' }); if (r.ok) modelo = MODELO_LOCAL; } catch {}
  const fs = await lib.FilesetResolver.forVisionTasks(base);
  const op = d => ({ baseOptions: { modelAssetPath: modelo, delegate: d }, runningMode: 'VIDEO', numPoses: 5, minPoseDetectionConfidence: .5, minPosePresenceConfidence: .5, minTrackingConfidence: .5 });
  try { return await lib.PoseLandmarker.createFromOptions(fs, op('GPU')); }
  catch { return await lib.PoseLandmarker.createFromOptions(fs, op('CPU')); }
}

/* escena sintetica para probar sin camara: 3 personas, una con polera+jean negros */
const FALSAS = [
  { x: .30, h: .78, cam: '#121212', pan: '#16181c', v: .05, f: .9 },
  { x: .56, h: .58, cam: '#b8452e', pan: '#2f4c7a', v: .07, f: 1.3 },
  { x: .78, h: .86, cam: '#d9d4c7', pan: '#141414', v: .04, f: .7 },
];
function poseFalsa(p, t) {
  const cx = p.x + Math.sin(t / 1000 * p.f) * p.v, top = .97 - p.h, h = p.h, L = (x, y) => ({ x, y, z: 0, visibility: .99 });
  const a = Array.from({ length: 33 }, () => L(cx, top + .3 * h));
  a[0] = L(cx, top + .07 * h);
  a[11] = L(cx + .1 * h, top + .2 * h); a[12] = L(cx - .1 * h, top + .2 * h);
  a[23] = L(cx + .065 * h, top + .52 * h); a[24] = L(cx - .065 * h, top + .52 * h);
  a[25] = L(cx + .07 * h, top + .75 * h); a[26] = L(cx - .07 * h, top + .75 * h);
  a[27] = L(cx + .07 * h, top + .97 * h); a[28] = L(cx - .07 * h, top + .97 * h);
  return a;
}
function pintarFalso(t) {
  const c = falso.getContext('2d'), w = falso.width, hh = falso.height;
  const g = c.createLinearGradient(0, 0, 0, hh); g.addColorStop(0, '#6d7378'); g.addColorStop(.62, '#8a8f8f'); g.addColorStop(.63, '#5b5e5a'); g.addColorStop(1, '#3f413d');
  c.fillStyle = g; c.fillRect(0, 0, w, hh);
  FALSAS.forEach(p => { const L = poseFalsa(p, t), X = q => q.x * w, Y = q => q.y * hh, h = p.h * hh;
    c.fillStyle = p.pan; c.fillRect(X(L[24]) - h * .05, Y(L[24]), X(L[23]) - X(L[24]) + h * .1, Y(L[27]) - Y(L[24]));
    c.fillStyle = p.cam; c.fillRect(X(L[12]) - h * .02, Y(L[12]) - h * .02, X(L[11]) - X(L[12]) + h * .04, Y(L[24]) - Y(L[12]) + h * .04);
    c.fillStyle = '#c69c7d'; c.beginPath(); c.arc(X(L[0]), Y(L[0]), h * .065, 0, 7); c.fill(); });
}

/* ---------- analisis de ropa ---------- */
function leerPixeles() {
  const w = fuente.w(), h = fuente.h(); if (!w || !h) return false;
  SW = 192; SH = Math.round(192 * h / w); if (muestra.width !== SW) { muestra.width = SW; muestra.height = SH; }
  mctx.drawImage(fuente.el, 0, 0, SW, SH); pix = mctx.getImageData(0, 0, SW, SH).data; return true;
}
function px(x, y) {                     // x,y normalizados -> [Y, croma] o null
  const i = ((Math.min(SH - 1, Math.max(0, y * SH | 0))) * SW + Math.min(SW - 1, Math.max(0, x * SW | 0))) * 4;
  const r = pix[i], g = pix[i + 1], b = pix[i + 2];
  return [.299 * r + .587 * g + .114 * b, Math.max(r, g, b) - Math.min(r, g, b)];
}
function cuad(q, n = 7) {               // q = [hombroI, hombroD, caderaD, caderaI]; muestreo encogido al centro
  const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4, cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;
  const k = .7, P = q.map(p => ({ x: cx + (p.x - cx) * k, y: cy + (p.y - cy) * k })), out = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const u = (i + .5) / n, v = (j + .5) / n;
    const ax = P[0].x + (P[1].x - P[0].x) * u, ay = P[0].y + (P[1].y - P[0].y) * u, bx = P[3].x + (P[2].x - P[3].x) * u, by = P[3].y + (P[2].y - P[3].y) * u;
    out.push(px(ax + (bx - ax) * v, ay + (by - ay) * v)); }
  return out;
}
function seg(a, b, n = 8) { const out = []; for (let i = 0; i < n; i++) { const u = .15 + .7 * (i + .5) / n; out.push(px(a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u)); } return out; }
const fracNegro = m => m.length ? m.filter(([y, c]) => y < S.thrY && c < S.thrC).length / m.length : 0;
const vis = (...p) => p.every(q => (q.visibility ?? 1) > .5 && q.x > 0 && q.x < 1 && q.y > 0 && q.y < 1);

function analizar(L) {
  const ok = L.filter(p => (p.visibility ?? 1) > .4 && p.x > -.05 && p.x < 1.05 && p.y > -.05 && p.y < 1.05);
  if (ok.length < 6 || !vis(L[11], L[12])) return null;
  let x0 = Math.min(...ok.map(p => p.x)), x1 = Math.max(...ok.map(p => p.x)), y0 = Math.min(...ok.map(p => p.y)), y1 = Math.max(...ok.map(p => p.y));
  const hom = Math.hypot(L[11].x - L[12].x, L[11].y - L[12].y);
  y0 -= hom * .45; x0 -= hom * .25; x1 += hom * .25; y1 += hom * .08;
  const d = { box: [Math.max(0, x0), Math.max(0, y0), Math.min(1, x1), Math.min(1, y1)], hom, L, torso: null, piernas: null, mT: [], mP: [] };
  if (vis(L[23], L[24])) { d.mT = cuad([L[12], L[11], L[23], L[24]]); d.torso = fracNegro(d.mT); }
  else { const fake = [L[12], L[11], { x: L[11].x, y: L[11].y + hom * 1.2 }, { x: L[12].x, y: L[12].y + hom * 1.2 }]; d.mT = cuad(fake); d.torso = fracNegro(d.mT); }
  if (vis(L[23], L[25]) || vis(L[24], L[26])) {
    if (vis(L[23], L[25])) d.mP.push(...seg(L[23], L[25])); if (vis(L[24], L[26])) d.mP.push(...seg(L[24], L[26]));
    if (vis(L[25], L[27])) d.mP.push(...seg(L[25], L[27])); if (vis(L[26], L[28])) d.mP.push(...seg(L[26], L[28]));
    d.piernas = fracNegro(d.mP);
  }
  return d;
}

/* ---------- seguimiento con ID y decision con histeresis ---------- */
function asociar(dets, t) {
  const cen = b => [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
  const pares = [];
  S.tracks.forEach((tr, i) => dets.forEach((d, j) => { const a = cen(tr.box), b = cen(d.box); pares.push([Math.hypot(a[0] - b[0], a[1] - b[1]), i, j]); }));
  pares.sort((p, q) => p[0] - q[0]);
  const usT = new Set(), usD = new Set();
  for (const [dist, i, j] of pares) { if (usT.has(i) || usD.has(j)) continue; const tr = S.tracks[i], d = dets[j];
    if (dist > Math.max(.12, (tr.box[2] - tr.box[0]) * .8)) continue; usT.add(i); usD.add(j); actualizar(tr, d, t); }
  dets.forEach((d, j) => { if (!usD.has(j)) { const tr = { id: S.sigId++, nace: t, score: .5, estado: 'ANALIZANDO', box: d.box.slice() }; actualizar(tr, d, t); S.tracks.push(tr); } });
  S.tracks = S.tracks.filter(tr => t - tr.visto < 700);
}
function actualizar(tr, d, t) {
  tr.box = tr.box.map((v, k) => v + (d.box[k] - v) * .55); tr.d = d; tr.visto = t;
  const conPiernas = d.piernas !== null;
  const aliado = conPiernas ? (d.torso > .55 && d.piernas > .5) : d.torso > .62;
  tr.score += ((aliado ? 1 : 0) - tr.score) * (conPiernas ? .14 : .07);
  if (t - tr.nace < 650) tr.estado = 'ANALIZANDO';
  else if (tr.score > .62) tr.estado = 'ALIADO';
  else if (tr.score < .38) tr.estado = 'OPONENTE';
  else if (tr.estado === 'ANALIZANDO') tr.estado = 'DESCONOCIDO';
  tr.conf = tr.estado === 'ALIADO' ? tr.score : 1 - tr.score;
  const fpx = fuente.w() / (2 * Math.tan(HFOV * Math.PI / 360));
  const hpx = d.hom * fuente.w(); tr.dist = hpx > 4 ? HOMBROS_M * fpx / hpx : null;
  tr.rumbo = ((tr.box[0] + tr.box[2]) / 2 - .5) * HFOV * (S.espejo ? -1 : 1);
  tr.parcial = !conPiernas;
}

/* ---------- calibracion: registrar el uniforme del equipo ---------- */
function pct(a, p) { const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; }
function calibrar(t) {
  const c = S.calib; if (!c) return;
  if (c.fase === 'cuenta' && t - c.t0 > 3000) { c.fase = 'muestra'; c.t1 = t; c.Y = []; c.C = []; }
  if (c.fase === 'muestra') {
    const tr = objetivo(); if (tr && tr.d) { [...tr.d.mT, ...tr.d.mP].forEach(([y, ch]) => { c.Y.push(y); c.C.push(ch); }); c.id = tr.id; }
    if (t - c.t1 > 1200) {
      if (c.Y.length < 40) { aviso('SIN PERSONA AL CENTRO · REPITE CON [R]', A, t); S.calib = null; return; }
      S.thrY = Math.round(Math.min(140, Math.max(40, pct(c.Y, .7) * 1.25 + 12)));
      S.thrC = Math.round(Math.min(90, Math.max(30, pct(c.C, .7) * 1.3 + 10)));
      const tr2 = S.tracks.find(x => x.id === c.id); if (tr2) { tr2.score = 1; tr2.estado = 'ALIADO'; }
      aviso('UNIFORME ALIADO REGISTRADO · UMBRAL ' + S.thrY, C, t); S.calib = null;
    }
  }
}
function aviso(txt, col, t) { S.msg = { txt, col, t }; }

/* objetivo = persona bajo la reticula (centro de la pantalla) */
function objetivo() {
  const m = mapa(), cx = m.W / 2, cy = m.H / 2; let mejor = null, md = 1e9;
  for (const tr of S.tracks) { const [a, b] = caja(tr.box, m); if (cx >= a.x && cx <= b.x && cy >= a.y && cy <= b.y) { const d = Math.hypot((a.x + b.x) / 2 - cx, (a.y + b.y) / 2 - cy); if (d < md) { md = d; mejor = tr; } } }
  return mejor;
}

/* ---------- geometria pantalla ---------- */
function mapa() { const W = innerWidth, H = innerHeight, vw = fuente.w() || 1280, vh = fuente.h() || 720, s = Math.max(W / vw, H / vh); return { W, H, s, vw, vh, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 }; }
function pt(x, y, m) { let X = x * m.vw * m.s + m.ox; if (S.espejo) X = m.W - X; return { x: X, y: y * m.vh * m.s + m.oy }; }
function caja(b, m) { const p = pt(b[0], b[1], m), q = pt(b[2], b[3], m); return [{ x: Math.min(p.x, q.x), y: p.y }, { x: Math.max(p.x, q.x), y: q.y }]; }

/* ---------- dibujo del HUD ---------- */
function tx(s, x, y, col = G, sz = 13, al = 'left', peso = 500) { ctx.font = `${peso} ${sz}px "IBM Plex Mono", monospace`; ctx.textAlign = al; ctx.fillStyle = col; ctx.fillText(s, x, y); }
function linea(pts, col = G, w = 1.6, dash = []) { ctx.beginPath(); ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.lineWidth = w; pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]); }
function esquinas(a, b, col, dash = []) { const L = Math.min(26, (b.x - a.x) * .25);
  linea([[a.x, a.y + L], [a.x, a.y], [a.x + L, a.y]], col, 2.2, dash); linea([[b.x - L, a.y], [b.x, a.y], [b.x, a.y + L]], col, 2.2, dash);
  linea([[b.x, b.y - L], [b.x, b.y], [b.x - L, b.y]], col, 2.2, dash); linea([[a.x + L, b.y], [a.x, b.y], [a.x, b.y - L]], col, 2.2, dash); }

function dibujar(t) {
  const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  if (hud.width !== W * dpr || hud.height !== H * dpr) { hud.width = W * dpr; hud.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.shadowColor = 'rgba(125,255,176,.55)'; ctx.shadowBlur = 6;
  const m = mapa(), cx = W / 2, cy = H / 2, u = Math.min(W, H) / 900;
  const obj = objetivo();

  /* personas */
  for (const tr of S.tracks) {
    const [a, b] = caja(tr.box, m), col = tr.estado === 'ALIADO' ? C : tr.estado === 'OPONENTE' ? A : tr.estado === 'DESCONOCIDO' ? A : G;
    ctx.shadowColor = col;
    esquinas(a, b, col, tr.estado === 'ANALIZANDO' ? [6, 5] : []);
    const id = 'ID ' + String(tr.id).padStart(2, '0');
    const nom = tr.estado === 'ALIADO' ? 'ALIADO' : tr.estado === 'OPONENTE' ? 'OPONENTE' : tr.estado === 'DESCONOCIDO' ? 'DESCONOCIDO' : 'ANALIZANDO…';
    tx(`${id} · ${nom}`, a.x, Math.max(84, a.y - 10), col, 13 * Math.max(.85, u), 'left', 600);
    const dist = tr.dist ? tr.dist.toFixed(1) + ' m' : '-- m';
    const sub = tr.estado === 'ALIADO' ? 'FUEGO BLOQUEADO' : tr.estado === 'ANALIZANDO' ? dist : `${dist} · ${Math.round(tr.conf * 100)}%`;
    const ys = a.y + 22;
    tx(sub + (tr.parcial && tr.estado !== 'ANALIZANDO' ? ' · PARCIAL' : ''), a.x + 10, ys, col, 12 * Math.max(.85, u));
    if (tr.estado === 'OPONENTE' && tr.d) { const p = pt((tr.d.L[11].x + tr.d.L[12].x) / 2, (tr.d.L[11].y + tr.d.L[23].y) / 2, m), r = 7;
      linea([[p.x, p.y - r], [p.x + r, p.y], [p.x, p.y + r], [p.x - r, p.y], [p.x, p.y - r]], A, 1.8); }
    if (tr.estado === 'ALIADO') { const p = { x: b.x - 16, y: a.y + 16 };     // escudo
      linea([[p.x - 7, p.y - 7], [p.x + 7, p.y - 7], [p.x + 7, p.y + 1], [p.x, p.y + 8], [p.x - 7, p.y + 1], [p.x - 7, p.y - 7]], C, 1.6); }
    if (S.diag && tr.d) { const d = tr.d, q = [d.L[12], d.L[11], d.L[23], d.L[24]].map(p => pt(p.x, p.y, m));
      linea([...q.map(p => [p.x, p.y]), [q[0].x, q[0].y]], '#ffffff88', 1, [3, 3]);
      tx(`T ${(d.torso * 100 | 0)}%  P ${d.piernas === null ? '--' : (d.piernas * 100 | 0) + '%'}  S ${tr.score.toFixed(2)}`, a.x + 10, ys + 16, '#ffffffcc', 11); }
  }
  ctx.shadowColor = 'rgba(125,255,176,.55)';

  /* cinta de rumbo (arriba): 0 = centro de la camara; marca el rumbo del objetivo */
  const tw = Math.min(560, W * .5), ty = 54 * Math.max(.8, u);
  for (let g = -35; g <= 35; g += 5) { const x = cx + g / 35 * tw / 2; linea([[x, ty], [x, ty + (g % 10 ? 8 : 14)]], G, 1.4);
    if (g % 10 === 0) tx(String((g + 360) % 360).padStart(3, '0'), x, ty - 8, G, 11, 'center'); }
  linea([[cx - 6, ty + 26], [cx, ty + 19], [cx + 6, ty + 26]], G, 1.6);
  if (obj) { const x = cx + Math.max(-35, Math.min(35, obj.rumbo)) / 35 * tw / 2, col = obj.estado === 'ALIADO' ? C : A; ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, ty + 18); ctx.lineTo(x - 6, ty + 30); ctx.lineTo(x + 6, ty + 30); ctx.fill(); }

  /* escalera de cabeceo */
  const esc = 150 * u;
  [-2, -1, 1, 2].forEach(k => { const y = cy + k * esc * .55, w1 = 70 * u, gap = 120 * u, dash = k > 0 ? [7, 5] : [];
    linea([[cx - gap - w1, y], [cx - gap, y], [cx - gap, y + (k < 0 ? 8 : -8)]], G, 1.3, dash);
    linea([[cx + gap + w1, y], [cx + gap, y], [cx + gap, y + (k < 0 ? 8 : -8)]], G, 1.3, dash);
    tx(String(Math.abs(k) * 10), cx - gap - w1 - 8, y + 4, G, 10, 'right'); tx(String(Math.abs(k) * 10), cx + gap + w1 + 8, y + 4, G, 10, 'left'); });

  /* reticula */
  const bloqueado = obj && obj.estado === 'ALIADO', marcado = obj && obj.estado === 'OPONENTE';
  const rc = bloqueado ? C : marcado ? A : G, R = 44 * u + 8;
  ctx.shadowColor = rc; ctx.save(); ctx.translate(cx, cy);
  if (!obj) ctx.rotate(t / 1000 * .5);
  ctx.beginPath(); ctx.strokeStyle = rc; ctx.lineWidth = 1.8; ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
  for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6, r2 = k % 3 ? R + 8 : R + 16; linea([[Math.cos(a) * R, Math.sin(a) * R], [Math.cos(a) * r2, Math.sin(a) * r2]], rc, 1.6); }
  ctx.restore();
  if (bloqueado) { const k = R * .55; linea([[cx - k, cy - k], [cx + k, cy + k]], C, 2.6); linea([[cx + k, cy - k], [cx - k, cy + k]], C, 2.6); }
  else { ctx.fillStyle = rc; ctx.beginPath(); ctx.arc(cx, cy, 2.6, 0, 7); ctx.fill(); }
  if (marcado) { const s = R + 26 + Math.sin(t / 120) * 3; linea([[cx, cy - s], [cx + s, cy], [cx, cy + s], [cx - s, cy], [cx, cy - s]], A, 1.6); }

  /* cintas laterales: distancia y confianza del objetivo (valores calculados) */
  const th = 300 * u + 60, tyy = cy - th / 2, lx = Math.max(24, W * .035), rx = W - Math.max(24, W * .035) - 74;
  [[lx, 'DIST', obj && obj.dist ? obj.dist.toFixed(1) : '--', 'M'], [rx, 'CONF', obj ? String(Math.round(obj.conf * 100)) : '--', '%']].forEach(([x, nom, val, un], i) => {
    ctx.strokeStyle = G; ctx.lineWidth = 1.3; ctx.strokeRect(x, tyy, 74, th);
    for (let k = 1; k < 12; k++) { const y = tyy + k * th / 12; linea(i ? [[x, y], [x + (k % 3 ? 8 : 16), y]] : [[x + 74, y], [x + 74 - (k % 3 ? 8 : 16), y]], G, 1.2); }
    ctx.fillStyle = '#000c'; ctx.fillRect(x - 10, cy - 16, 94, 32); ctx.strokeRect(x - 10, cy - 16, 94, 32);
    tx(val, x + 37, cy + 6, W_, 18, 'center', 600); tx(nom + ' ' + un, x + 37, tyy - 10, G, 11, 'center'); });

  /* banner central */
  if (bloqueado && Math.floor(t / 380) % 2 === 0 || bloqueado && S.estatico) {
    const bw = 340, bh = 58, bx = cx - bw / 2, by = cy + R + 40;
    ctx.shadowColor = C; ctx.fillStyle = 'rgba(0,20,30,.72)'; ctx.fillRect(bx, by, bw, bh); ctx.strokeStyle = C; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
    tx('FUEGO BLOQUEADO', cx, by + 27, C, 20, 'center', 600); tx('ALIADO ID ' + String(obj.id).padStart(2, '0') + ' EN LA MIRA', cx, by + 46, C, 11, 'center'); }
  else if (marcado) tx('OBJETIVO ID ' + String(obj.id).padStart(2, '0') + ' · DECISIÓN DEL TIRADOR', cx, cy + R + 60, A, 13, 'center', 600);
  ctx.shadowColor = 'rgba(125,255,176,.55)';

  /* textos de estado */
  const aliados = S.tracks.filter(x => x.estado === 'ALIADO').length;
  tx('MIRA S-01 · DEMO DE SOFTWARE', 24, 32, G, 13, 'left', 600);
  tx('IFF: UNIFORME NEGRO (POLERA + JEAN) · UMBRAL ' + S.thrY, 24, 50, G, 11);
  const d = new Date(), hh = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
  tx(hh, W - 24, 32, G, 13, 'right', 600); tx(`${S.fps | 0} FPS${prueba ? ' · ESCENA DE PRUEBA' : ''}`, W - 24, 50, G, 11, 'right');
  tx('MODO ENTRENAMIENTO · SEGURO DE ALIADOS ACTIVO', cx, H - 46, G, 13, 'center', 600);
  tx(`PERSONAS ${S.tracks.length} · ALIADOS ${aliados} · OPONENTES ${S.tracks.filter(x => x.estado === 'OPONENTE').length}`, cx, H - 26, G, 11, 'center');
  tx('SOLO VISUALIZA · NUNCA DISPARA', W - 24, H - 26, A, 11, 'right', 600);
  if (S.ayuda) { tx('[R] REGISTRAR ALIADO · [ ] UMBRAL · [M] ESPEJO', 24, H - 46, '#9fbfae', 10.5); tx('[C] CÁMARA · [F] PANTALLA · [D] DIAGNÓSTICO · [H] OCULTAR', 24, H - 26, '#9fbfae', 10.5); }

  /* calibracion y avisos */
  if (S.calib) { const c = S.calib, n = c.fase === 'cuenta' ? Math.ceil((3000 - (t - c.t0)) / 1000) : null;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(cx - 260, 96, 520, 74); ctx.strokeStyle = C; ctx.strokeRect(cx - 260, 96, 520, 74);
    tx('REGISTRAR UNIFORME ALIADO', cx, 124, C, 15, 'center', 600);
    tx(n ? `PÁRATE EN EL CENTRO DE LA MIRA · ${n}` : 'LEYENDO COLORES…', cx, 152, W_, 13, 'center'); }
  else if (S.msg && t - S.msg.t < 3000) { tx(S.msg.txt, cx, 132, S.msg.col, 14, 'center', 600); }
  ctx.shadowBlur = 0;
}

/* ---------- bucle ---------- */
let ultimo = -1, tPrev = performance.now();
function cuadro() {
  const t = performance.now();
  if (prueba) pintarFalso(t);
  let poses = null;
  if (prueba) poses = FALSAS.map(p => poseFalsa(p, t));
  else if (detector && video.readyState >= 2 && video.currentTime !== ultimo) { ultimo = video.currentTime; const r = detector.detectForVideo(video, t); poses = r.landmarks || []; }
  if (poses && leerPixeles()) { asociar(poses.map(analizar).filter(Boolean), t); }
  calibrar(t); dibujar(t);
  const dt = t - tPrev; tPrev = t; S.fps += ((1000 / Math.max(1, dt)) - S.fps) * .05;
  if (!S.estatico) requestAnimationFrame(cuadro);
}

/* ---------- controles ---------- */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { S.calib = { fase: 'cuenta', t0: performance.now() }; }
  else if (k === '[') { S.thrY = Math.max(30, S.thrY - 4); aviso('UMBRAL ' + S.thrY, G, performance.now()); }
  else if (k === ']') { S.thrY = Math.min(160, S.thrY + 4); aviso('UMBRAL ' + S.thrY, G, performance.now()); }
  else if (k === 'm') { S.espejo = !S.espejo; video.classList.toggle('espejo', S.espejo); falso.classList.toggle('espejo', S.espejo); }
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'd') S.diag = !S.diag;
  else if (k === 'h') S.ayuda = !S.ayuda;
  else if (k === 'c' && S.camaras.length > 1) { S.camIdx = (S.camIdx + 1) % S.camaras.length; iniciarCamara(S.camIdx).then(() => aviso('CÁMARA ' + (S.camIdx + 1) + '/' + S.camaras.length, G, performance.now())); }
});

$('arrancar').addEventListener('click', async () => {
  const est = $('estado'), b = $('arrancar'); b.disabled = true;
  try {
    if (prueba) { fuente = { el: falso, w: () => falso.width, h: () => falso.height }; falso.classList.remove('oculto'); }
    else {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('Este navegador no permite usar la cámara aquí. Ábrelo en Chrome desde un enlace https.');
      est.textContent = 'PIDIENDO PERMISO DE CÁMARA…';
      await iniciarCamara();
      S.camaras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      video.classList.remove('oculto');
      est.textContent = 'CARGANDO RED NEURONAL…';
      detector = await cargarDetector();
    }
    $('inicio').classList.add('oculto');
    requestAnimationFrame(cuadro);
  } catch (e) {
    console.error(e); b.disabled = false;
    est.style.color = A;
    est.textContent = e.name === 'NotAllowedError' ? 'PERMISO DE CÁMARA DENEGADO · ACTÍVALO EN EL CANDADO DE LA BARRA DE DIRECCIÓN' :
      e.name === 'NotFoundError' ? 'NO SE ENCONTRÓ NINGUNA CÁMARA' : 'ERROR: ' + (e.message || e);
  }
});
if (prueba) { const q = new URLSearchParams(location.search); if (q.has('aliado')) { FALSAS[0].x = .5; FALSAS[1].x = .27; } if (q.has('auto')) $('arrancar').click(); }
window.__S = S; window.__cuadro = cuadro;
</script>
